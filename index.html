<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INKFORGE</title>
<meta name="theme-color" content="#1d1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3efe8;--panel:#fffdf9;--ink:#1d1a17;--mute:#6f675e;--line:#ddd5c8;--acc:#7a1f2b;--accfg:#fff;--ok:#2d6a4f;--warn:#9a6700;--err:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--panel:#211c17;--ink:#f1ebe2;--mute:#a39a8e;--line:#3a322a;--acc:#e0a96d;--accfg:#1d1a17;--ok:#74c69d;--warn:#e9c46a;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--panel:#211c17;--ink:#f1ebe2;--mute:#a39a8e;--line:#3a322a;--acc:#e0a96d;--accfg:#1d1a17;--ok:#74c69d;--warn:#e9c46a;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Iowan Old Style",serif}
h1,h2,h3{font-family:"Palatino Linotype",Palatino,Georgia,serif;margin:0 0 .5rem;line-height:1.2}
h1{font-size:1.5rem;letter-spacing:.02em}h2{font-size:1.25rem}h3{font-size:1.05rem}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line)}
nav button{flex:none;font:inherit;font-size:.9rem;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
nav button[disabled]{opacity:.45;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
input,select,textarea{font:inherit;font-size:1rem;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:180px;line-height:1.6}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 2px}
.btn{font:inherit;font-size:.9rem;padding:7px 12px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.err{color:var(--err);border-color:var(--err)}
.mute{color:var(--mute);font-size:.9rem}.err{color:var(--err)}.ok{color:var(--ok)}.warn{color:var(--warn)}
ul{padding-left:1.1rem;margin:.3rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat b{display:block;font-size:1.6rem;font-family:"Palatino Linotype",Palatino,Georgia,serif}
.wide{overflow-x:auto}
</style>
</head>
<body>
<header><h1>INKFORGE</h1><span id="store" class="tag">loading</span></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
"use strict";
/* ---------- Config: workflow tables (deterministic; no LLM decides state) ---------- */
const CH_FLOW={draft:{submit:"review"},review:{approve:"approved",reject:"draft"},approved:{reopen:"review"}};
const BK_FLOW={drafting:{to_qa:"qa"},qa:{back_to_drafting:"drafting",approve:"approved"},approved:{revoke:"qa"}};
const VIEWS=[["overview","Overview"],["pens","Pen names"],["series","Series"],["books","Books"],["studio","Story Studio"],["bible","Series Bible"],["tasks","AI Tasks"],["log","History"],["settings","Settings"]];
const PLANNED=["Market","Writer’s Room","Editorial","Publishing","Analytics"];
const SCHEMA=1;

/* ---------- State + persistence (IndexedDB, falls back to memory) ---------- */
const blank=()=>({schema:SCHEMA,pens:[],series:[],books:[],chapters:[],versions:[],approvals:[],briefs:[],canon:[],tasks:[],findings:[],log:[],settings:{noAI:true,kill:true,paid:false,tol:15,provider:"gemini",model:"gemini-2.5-flash",limit:20,maxOut:6000,retries:2,coolUntil:"",timeoutMs:60000,backoffMs:1000}});
let S=blank(),db=null,storeOK=false,view="overview",bookId=null,msg="";
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const id=p=>p+"_"+(crypto.randomUUID?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10));
const now=()=>new Date().toISOString();
const wc=t=>(t||"").trim().split(/\s+/).filter(Boolean).length;

function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open("inkforge",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function load(){try{db=await openDB();const v=await new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get("state");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(v){S=migrate(v)}storeOK=true}catch(e){storeOK=false}paintStore()}
function migrate(v){const b=blank();const o=Object.assign(b,v);o.settings=Object.assign(b.settings,v.settings||{});o.schema=SCHEMA;o.tasks.forEach(t=>{if(t.status==="running"){t.status="queued";t.error="Interrupted by a page reload. Run again."}});return o}
function save(){if(!db){return}try{db.transaction("kv","readwrite").objectStore("kv").put(JSON.parse(JSON.stringify(S)),"state")}catch(e){storeOK=false;paintStore()}}
function paintStore(){const e=$("#store");e.textContent=storeOK?"saved on this device":"storage unavailable – data lost on close";e.className="tag "+(storeOK?"ok":"err")}
function log(kind,detail,ref){S.log.unshift({id:id("log"),at:now(),kind,detail,ref:ref||null});S.log=S.log.slice(0,500)}
function commit(){save();render()}

/* ---------- Domain logic ---------- */
function chaptersOf(b){return S.chapters.filter(c=>c.bookId===b).sort((a,c)=>a.number-c.number)}
function chTransition(c,act){
  const to=(CH_FLOW[c.status]||{})[act];if(!to)return"Action “"+act+"” is not allowed from “"+c.status+"”.";
  if(act==="submit"||act==="approve"){if(!wc(c.text))return"Chapter is empty."}
  if(act==="approve"){const n=openHigh(c.id);if(n)return n+" unresolved high-severity finding(s). Resolve or dismiss them first."}
  const from=c.status;c.status=to;c.updated=now();
  if(act==="approve")S.approvals.push({id:id("apr"),kind:"chapter",ref:c.id,at:now(),version:c.version});
  log("chapter."+act,c.title+": "+from+" → "+to,c.id);return""}
function qa(bk){
  const cs=chaptersOf(bk.id),errs=[],warns=[];
  if(!cs.length)errs.push("Book has no chapters.");
  cs.forEach((c,i)=>{
    if(c.number!==i+1)errs.push("Chapter order: expected number "+(i+1)+" but found "+c.number+" (“"+c.title+"”).");
    if(!wc(c.text))errs.push("Chapter "+c.number+" is empty.");
    if(c.status!=="approved")errs.push("Chapter "+c.number+" is not approved (status: "+c.status+").");
  });
  const hf=S.findings.filter(f=>f.bookId===bk.id&&f.severity==="high"&&["open","accepted","escalated"].includes(f.status)).length;if(hf)errs.push(hf+" unresolved high-severity finding(s).");
  const seen=new Map();
  cs.forEach(c=>(c.text||"").split(/\n{2,}/).map(p=>p.trim()).filter(p=>p.length>=40).forEach(p=>{const k=p.toLowerCase();if(seen.has(k)&&seen.get(k)!==c.number)warns.push("Duplicate paragraph in chapters "+seen.get(k)+" and "+c.number+": “"+p.slice(0,50)+"…”");else if(seen.has(k))warns.push("Repeated paragraph inside chapter "+c.number+": “"+p.slice(0,50)+"…”");else seen.set(k,c.number)}));
  const tot=cs.reduce((n,c)=>n+wc(c.text),0);
  if(bk.target&&tot){const d=Math.abs(tot-bk.target)/bk.target*100;if(d>S.settings.tol)warns.push("Word count "+tot+" is "+d.toFixed(0)+"% from target "+bk.target+" (tolerance "+S.settings.tol+"%).")}
  return{errs,warns,tot}}
function bkTransition(b,act){
  const to=(BK_FLOW[b.status]||{})[act];if(!to)return"Action “"+act+"” is not allowed from “"+b.status+"”.";
  if(act==="to_qa"&&!chaptersOf(b.id).length)return"Add at least one chapter first.";
  if(act==="approve"){const r=qa(b);if(r.errs.length)return"Quality gate failed: "+r.errs[0]+(r.errs.length>1?" (+"+(r.errs.length-1)+" more)":"")}
  const from=b.status;b.status=to;
  if(act==="approve")S.approvals.push({id:id("apr"),kind:"book",ref:b.id,at:now(),chapters:chaptersOf(b.id).map(c=>c.id+"@v"+c.version)});
  log("book."+act,b.title+": "+from+" → "+to,b.id);return""}
function manuscript(b){
  const pen=S.pens.find(p=>p.id===(S.series.find(s=>s.id===b.seriesId)||{}).penId);
  let o=(b.status==="approved"?"":"[UNAPPROVED DRAFT – NOT FOR PUBLICATION]\n\n")+"# "+b.title+"\n"+(pen?"by "+pen.name+"\n":"")+"\n";
  chaptersOf(b.id).forEach(c=>{o+="## Chapter "+c.number+": "+c.title+"\n\n"+(c.text||"").trim()+"\n\n"});return o}

/* ---------- Phase 2: story brief + canon ---------- */
let selBook="",selSeries="";
const BRIEF=[["audience","Target readership","s",1],["genre","Genre and subgenre","s",1],["tone","Tone","s"],["heat","Heat level","s"],["premise","Core premise","t",1],["pairing","Romantic pairing","s",1],["motivations","Character motivations","t"],["flaws","Character flaws","t"],["conflict","Central conflict","t",1],["stakes","External stakes","t"],["internal","Internal emotional conflicts","t"],["progression","Relationship progression","t"],["beats","Major plot beats","t"],["pov","Point of view","s",1],["tense","Narrative tense","s",1],["length","Target length (words)","s"],["ending","Ending requirements","t",1],["seriesLinks","Series connections","t"],["boundaries","Content boundaries","t"],["continuity","Continuity restrictions","t"],["positioning","Commercial positioning","t",1],["differentiation","Differentiation hypothesis","t"]];
const briefsOf=b=>S.briefs.filter(x=>x.bookId===b).sort((a,c)=>c.version-a.version);
const approvedBrief=b=>briefsOf(b).find(x=>x.status==="approved");
function readBrief(br){BRIEF.forEach(f=>{const e=$("#bf_"+f[0]);if(e)br.fields[f[0]]=e.value})}
const CANON_FLOW={proposed:{approve:"approved",reject:"rejected"},approved:{flag:"contradicted",supersede:"superseded"},contradicted:{approve:"approved",supersede:"superseded"}};
const CTYPES=["character","location","relationship","timeline","fact","thread"];
const norm=t=>(t||"").trim().toLowerCase().replace(/\s+/g," ");
const sameKey=(a,b)=>a.seriesId===b.seriesId&&a.type===b.type&&norm(a.name)===norm(b.name)&&norm(a.desc)!==norm(b.desc);
function contradictions(sid){const live=S.canon.filter(c=>c.seriesId===sid&&(c.status==="proposed"||c.status==="approved"));const out=[];for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){const a=live[i],b=live[j];if(sameKey(a,b)&&a.supersedes!==b.id&&b.supersedes!==a.id)out.push([a,b])}return out}
function canonTransition(c,act){
  const to=(CANON_FLOW[c.status]||{})[act];if(!to)return"Not allowed from “"+c.status+"”.";
  if(act==="approve"){const x=S.canon.find(o=>o.id!==c.id&&o.status==="approved"&&sameKey(o,c)&&c.supersedes!==o.id);if(x)return"Conflicts with approved canon "+x.id+". Re-propose this as a replacement of that entry.";
    if(c.supersedes){const o=S.canon.find(y=>y.id===c.supersedes);if(o&&o.status!=="superseded"){o.status="superseded";o.version++;log("canon.supersede",o.name+" replaced by "+c.id,o.id)}}}
  const from=c.status;c.status=to;c.version++;
  if(act==="approve")S.approvals.push({id:id("apr"),kind:"canon",ref:c.id,at:now(),version:c.version});
  log("canon."+act,c.name+": "+from+" → "+to,c.id);return""}

function vStudio(){
  if(!S.books.length)return'<p class="mute">Create a book first.</p>';
  if(!S.books.find(b=>b.id===selBook))selBook=S.books[0].id;
  const br=briefsOf(selBook)[0];
  let h='<div class="card"><label>Book</label><select id="sb">'+opts(S.books,selBook,b=>b.title)+'</select><p class="mute">Concept generation needs an AI provider, which this build does not have. Enter the concept by hand.</p></div>'+(msg?'<p class="err">'+esc(msg)+'</p>':'');
  if(!br)return h+'<button class="btn" data-a="newBrief">Start story brief</button>';
  const lock=br.status!=="draft";
  h+='<div class="card"><div class="row sp"><h3>Brief v'+br.version+'</h3>'+tag(br.status)+'</div>';
  BRIEF.forEach(f=>{const v=br.fields[f[0]]||"";h+='<label>'+f[1]+(f[3]?" (required)":"")+'</label>'+(f[2]==="t"?'<textarea id="bf_'+f[0]+'" style="min-height:80px"'+(lock?" readonly":"")+'>'+esc(v)+'</textarea>':'<input id="bf_'+f[0]+'" value="'+esc(v)+'"'+(lock?" readonly":"")+'>')});
  h+='<div class="row" style="margin-top:10px">'+(lock?'<button class="btn" data-a="reviseBrief">Start new version</button>':'<button class="btn alt" data-a="saveBrief">Save draft</button><button class="btn" data-a="approveBrief">Approve brief</button>')+'</div>'+(lock?'<p class="mute">Approved briefs are locked. Later stages use this version until you approve a newer one.</p>':'')+'</div>';
  return h}

function vBible(){
  if(!S.series.length)return'<p class="mute">Create a series first.</p>';
  if(!S.series.find(s=>s.id===selSeries))selSeries=S.series[0].id;
  const cs=S.canon.filter(c=>c.seriesId===selSeries),ap=cs.filter(c=>c.status==="approved");
  let h='<div class="card"><label>Series</label><select id="sbs">'+opts(S.series,selSeries,s=>s.name)+'</select></div>'+(msg?'<p class="err">'+esc(msg)+'</p>':'');
  h+='<div class="card"><h3>Propose entry</h3><label>Type</label><select id="ct">'+CTYPES.map(t=>'<option>'+t+'</option>').join('')+'</select><label>Name</label><input id="cn"><label>Description</label><textarea id="cd" style="min-height:70px"></textarea><label>Source (brief, chapter 3, …)</label><input id="cs"><label>Replaces approved entry (optional)</label><select id="cr"><option value="">None</option>'+opts(ap,"",c=>c.type+": "+c.name)+'</select><p><button class="btn" data-a="addCanon">Propose</button></p></div>';
  const cx=contradictions(selSeries);
  if(cx.length)h+='<div class="card"><h3 class="warn">Possible contradictions</h3><ul>'+cx.map(p=>'<li>'+esc(p[0].type+": "+p[0].name)+' has two descriptions: '+p[0].id+' (“'+esc(p[0].desc.slice(0,60))+'”) vs '+p[1].id+' (“'+esc(p[1].desc.slice(0,60))+'”)</li>').join('')+'</ul><p class="mute">Name-and-type match with different text. This is a deterministic check, not a semantic one.</p></div>';
  const L={approve:"Approve as canon",reject:"Reject",flag:"Mark contradicted",supersede:"Mark superseded"};
  h+=cs.length?cs.map(c=>'<div class="card"><div class="row sp"><h3>'+esc(c.name)+'</h3>'+tag(c.status)+'</div><p class="mute">'+esc(c.type)+' · '+c.id+' · v'+c.version+(c.source?' · source: '+esc(c.source):'')+(c.supersedes?' · replaces '+c.supersedes:'')+'</p><p>'+esc(c.desc)+'</p><div class="row">'+Object.keys(CANON_FLOW[c.status]||{}).map(a=>'<button class="btn'+(a==="approve"?"":" alt")+'" data-a="canon" data-act="'+a+'" data-id="'+c.id+'">'+L[a]+'</button>').join('')+(c.status==="proposed"?'<button class="btn alt" data-a="delCanon" data-id="'+c.id+'">Delete</button>':'')+'</div></div>').join(''):'<p class="mute">No entries yet. Propose characters, locations, facts and open threads.</p>';
  return h}

/* ---------- Phase 3: provider router, tasks, outlines, drafts ---------- */
const KEYNAME="inkforge_provider_key",ctl={};
const getKey=()=>{try{return localStorage.getItem(KEYNAME)||""}catch(e){return""}};
const cyrb=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const PROMPTS={editorial:{v:"editorial.1",sys:"You are a careful fiction editor. Reply with ONLY a JSON array, no markdown fences and no commentary."},outline:{v:"outline.1",sys:"You are a developmental planner for commercial fiction. Reply with ONLY a JSON array, no markdown fences and no commentary."},draft:{v:"draft.1",sys:"You are a fiction author drafting one chapter. Reply with the chapter prose only: no headings, no commentary, no notes."}};
const OKEYS=[["pov","POV"],["purpose","Purpose"],["start","Starting state"],["events","Events"],["decisions","Decisions"],["beats","Emotional beats"],["progression","Relationship progression"],["conflict","Conflict"],["end","Ending state"],["refs","Continuity refs"],["target","Target words"]];
const fmtOutline=o=>OKEYS.filter(k=>o[k[0]]).map(k=>k[1]+": "+o[k[0]]).join("\n");
const canonText=sid=>S.canon.filter(c=>c.seriesId===sid&&c.status==="approved").map(c=>"- ["+c.type+"] "+c.name+": "+c.desc).join("\n").slice(0,6000)||"(none approved)";
const briefText=br=>BRIEF.map(f=>f[1]+": "+(br.fields[f[0]]||"")).join("\n");
const callsToday=()=>S.tasks.reduce((n,t)=>n+t.calls.filter(c=>c.at.slice(0,10)===now().slice(0,10)).length,0);
/* Provider adapter: all Gemini specifics live here. Not verified against the live API. */
const PROVIDERS={gemini:{async call({key,model,system,prompt,maxOut,json,signal}){
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{method:"POST",signal,headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:Object.assign({maxOutputTokens:maxOut},json?{responseMimeType:"application/json"}:{})})});
  if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}
  const d=await r.json(),p=(((d.candidates||[])[0]||{}).content||{}).parts||[],u=d.usageMetadata;
  return{text:p.map(x=>x.text||"").join(""),usage:u&&u.totalTokenCount!=null?{prompt:u.promptTokenCount,output:u.candidatesTokenCount,total:u.totalTokenCount}:null}}}};
function ineligible(){const s=S.settings;if(s.kill)return"Global AI kill switch is on.";if(s.noAI)return"No-AI mode is on.";if(!getKey())return"No API key set (Settings).";if(callsToday()>=s.limit)return"Daily call limit ("+s.limit+") reached.";if(s.coolUntil&&s.coolUntil>now())return"Provider cooling down until "+s.coolUntil.slice(11,16)+" UTC.";return""}
function classify(e){if(e.name==="AbortError")return"cancelled";const s=e.status;if(!s)return"transient";if(s===429)return"quota";if(s>=500)return"transient";if(s===401||s===403)return"auth";return"permanent"}
function validate(t,text){
  if(t.kind==="editorial"){let v;try{v=JSON.parse(text.trim().replace(/^```(?:json)?\s*|\s*```$/g,""))}catch(e){return{error:"Reply was not valid JSON."}}
    if(!Array.isArray(v)||v.length>25)return{error:"Expected a JSON array of at most 25 findings."};
    for(let i=0;i<v.length;i++){const o=v[i];if(!o||!["high","medium","low"].includes(o.severity))return{error:"Finding "+(i+1)+" has an invalid severity."};for(const k of["category","description","action"])if(typeof o[k]!=="string"||!o[k].trim())return{error:"Finding "+(i+1)+" is missing “"+k+"”."};if(typeof o.evidence!=="string")return{error:"Finding "+(i+1)+" is missing “evidence”."}}
    return{value:v}}
  if(t.kind==="outline"){let v;try{v=JSON.parse(text.trim().replace(/^```(?:json)?\s*|\s*```$/g,""))}catch(e){return{error:"Reply was not valid JSON."}}
    if(!Array.isArray(v)||!v.length||v.length>60)return{error:"Expected a JSON array of 1 to 60 chapters."};
    for(let i=0;i<v.length;i++)for(const k of["title","purpose","events","end"])if(!v[i]||typeof v[i][k]!=="string"||!v[i][k].trim())return{error:"Chapter "+(i+1)+" is missing “"+k+"”."};
    return{value:v}}
  const w=wc(text);return w<50?{error:"Draft is too short ("+w+" words)."}:{value:text.trim()}}
function mkTask(kind,ref,prompt){
  const sys=PROMPTS[kind].sys,key=cyrb([kind,ref,PROMPTS[kind].v,S.settings.model,sys,prompt].join("|"));
  const dup=S.tasks.find(t=>t.key===key&&!t.closed&&["done","queued","running"].includes(t.status));
  if(dup){msg=dup.status==="done"?"Same inputs already produced a result. Reused it; no new call.":"An identical task is already "+dup.status+".";return null}
  const t={id:id("task"),kind,ref,key,promptVersion:PROMPTS[kind].v,provider:S.settings.provider,model:S.settings.model,sys,prompt,status:"queued",attempts:0,calls:[],error:"",created:now(),updated:now()};
  S.tasks.unshift(t);S.tasks=S.tasks.slice(0,100);log("task.create",kind,t.id);return t}
async function runTask(t){
  const st=S.settings,why=ineligible();
  if(why){t.status="queued";t.error=why;t.updated=now();log("task.queued",t.kind+" – "+why,t.id);return commit()}
  t.status="running";t.error="";t.attempts=0;t.updated=now();commit();
  const key=getKey();let extra="";
  for(;;){
    if(callsToday()>=st.limit){t.status="queued";t.error="Daily call limit reached.";break}
    t.attempts++;let timedOut=false;const c=ctl[t.id]=new AbortController(),to=setTimeout(()=>{timedOut=true;c.abort()},st.timeoutMs||60000),prompt=t.prompt+extra;
    try{
      const r=await PROVIDERS[st.provider].call({key,model:t.model,system:t.sys,prompt,maxOut:st.maxOut,json:t.kind!=="draft",signal:c.signal});clearTimeout(to);
      t.calls.push({at:now(),reported:r.usage,estimated:{prompt:Math.ceil((t.sys.length+prompt.length)/4),output:Math.ceil(r.text.length/4)}});
      const v=validate(t,r.text);
      if(v.error){if(t.attempts<=st.retries){extra="\n\nYour previous reply was rejected: "+v.error+" Reply again in the required format only.";commit();continue}t.status="failed";t.error="Invalid response after "+t.attempts+" attempt(s): "+v.error;break}
      t.result=v.value;t.status="done";t.error="";break}
    catch(e){clearTimeout(to);const k=timedOut?"transient":classify(e);
      if(k==="cancelled"){t.status="cancelled";t.error="Cancelled.";break}
      if(k==="transient"&&t.attempts<=st.retries){await new Promise(r=>setTimeout(r,(st.backoffMs||1000)*2**(t.attempts-1)));if(t.status==="cancelled")break;continue}
      if(k==="quota"){S.settings.coolUntil=new Date(Date.now()+600000).toISOString();t.status="queued";t.error="Quota or rate limit hit (HTTP 429). Provider paused for 10 minutes; task kept.";break}
      t.status="failed";t.error=({auth:"Key rejected (HTTP "+e.status+"). Check the API key.",permanent:"Request rejected (HTTP "+e.status+"). Check the model id.",transient:"Provider unreachable after "+t.attempts+" attempt(s). Content is safe; try again later."})[k];break}}
  if(t.status==="done"&&t.kind==="editorial"&&!t.ingested)ingest(t);delete ctl[t.id];t.updated=now();log("task."+t.status,t.kind+(t.error?" – "+t.error:""),t.id);commit()}
function draftBox(c){const t=S.tasks.find(x=>x.kind==="draft"&&x.ref===c.id&&!x.closed);if(!t)return"";
  if(t.status==="done")return'<div class="card" style="background:var(--bg)"><b>AI draft ready</b> · '+wc(t.result)+' words<div class="row" style="margin-top:6px"><button class="btn" data-a="useDraft" data-id="'+t.id+'">Use draft (current text kept as a version)</button><button class="btn alt" data-a="discardDraft" data-id="'+t.id+'">Discard</button></div></div>';
  return'<p class="mute">AI draft task: '+t.status+(t.error?" – "+esc(t.error):"")+" (see AI Tasks)</p>"}
function vTasks(){const why=ineligible();
  let h='<div class="card"><p>Calls today: <b>'+callsToday()+"</b> of "+S.settings.limit+' (UTC day). Provider free quota: <b>unknown</b> (never assumed).</p><p class="'+(why?"warn":"ok")+'">'+(why?"AI unavailable: "+esc(why):"AI eligible and ready.")+"</p></div>"+(msg?'<p class="err">'+esc(msg)+"</p>":"");
  return h+(S.tasks.length?S.tasks.map(t=>{const rep=t.calls.reduce((a,c)=>a+(c.reported?c.reported.total||0:0),0),est=t.calls.reduce((a,c)=>a+c.estimated.prompt+c.estimated.output,0),ap=t.kind==="outline"&&t.status==="done"&&!t.closed;
    return'<div class="card"><div class="row sp"><h3>'+esc(t.kind)+" · "+t.id+"</h3>"+tag(t.status)+'</div><p class="mute">'+esc(t.provider)+" / "+esc(t.model)+" · "+t.promptVersion+" · attempts "+t.attempts+" · calls "+t.calls.length+'</p><p class="mute">Tokens: reported '+(t.calls.some(c=>c.reported)?rep:"not reported")+" · estimated ~"+est+" (characters ÷ 4)</p>"+(t.error?'<p class="err">'+esc(t.error)+"</p>":"")+'<div class="row">'+(["queued","failed","cancelled"].includes(t.status)?'<button class="btn" data-a="runT" data-id="'+t.id+'">Run</button>':"")+(["queued","running"].includes(t.status)?'<button class="btn alt" data-a="cancelT" data-id="'+t.id+'">Cancel</button>':"")+(ap?'<button class="btn" data-a="applyOutline" data-id="'+t.id+'">Apply outline ('+t.result.length+' chapters)</button><button class="btn alt" data-a="closeT" data-id="'+t.id+'">Discard</button>':"")+"</div>"+(ap?"<ul>"+t.result.map(o=>"<li>"+esc(o.title)+"</li>").join("")+"</ul>":"")+"</div>"}).join(""):'<p class="mute">No AI tasks yet. Generate an outline or chapter draft from a book.</p>')}

const SCOPES={developmental:"story structure, pacing and scene purpose",romance:"romantic and emotional arc, chemistry and tension",continuity:"contradictions with the approved canon and brief",line:"sentence-level style and clarity",copy:"grammar, usage and consistency",proof:"typos and punctuation",voice:"voice and style consistency and repetition"};
const FIND_FLOW={open:{accept:"accepted",dismiss:"dismissed",escalate:"escalated",resolve:"resolved"},accepted:{resolve:"resolved",dismiss:"dismissed"},escalated:{accept:"accepted",dismiss:"dismissed",resolve:"resolved"}};
const openHigh=cid=>S.findings.filter(f=>f.chapterId===cid&&f.severity==="high"&&["open","accepted","escalated"].includes(f.status)).length;
function fTransition(f,act){const to=(FIND_FLOW[f.status]||{})[act];if(!to)return"Not allowed from “"+f.status+"”.";f.status=to;log("finding."+act,f.category+" → "+to,f.id);return""}
function ingest(t){const c=S.chapters.find(x=>x.id===t.ref);if(!c)return;const h=cyrb(c.text);
  t.result.forEach(o=>{const ev=String(o.evidence||"").trim(),found=!!ev&&c.text.includes(ev);S.findings.push({id:id("fnd"),chapterId:c.id,bookId:c.bookId,taskId:t.id,scope:t.scope||"",severity:o.severity,category:String(o.category),desc:String(o.description),evidence:ev,evidenceFound:found,replacement:o.replacement?String(o.replacement):"",action:String(o.action),confidence:typeof o.confidence==="number"?o.confidence:null,textHash:h,status:"open",needsHuman:o.severity==="high"||!found,created:now()})});
  t.ingested=true;log("findings.ingest",t.result.length+" finding(s) for "+c.title,t.id)}
function findBox(c){const fs=S.findings.filter(f=>f.chapterId===c.id&&f.status!=="dismissed"&&f.status!=="resolved"),h=cyrb(c.text),t=S.tasks.find(x=>x.kind==="editorial"&&x.ref===c.id&&["queued","running","failed"].includes(x.status));
  let o='<div class="card" style="background:var(--bg)"><h3>Editorial</h3>'+(c.status==="approved"?"":'<div class="row"><select id="es_'+c.id+'" style="width:auto">'+Object.keys(SCOPES).map(k=>"<option>"+k+"</option>").join("")+'</select><button class="btn alt" data-a="genEdit" data-id="'+c.id+'">Run check</button></div>')+(t?'<p class="mute">Check '+t.status+(t.error?" – "+esc(t.error):"")+" (see AI Tasks)</p>":"");
  return o+(fs.length?fs.map(f=>'<div style="border-top:1px solid var(--line);padding:6px 0"><span class="tag '+(f.severity==="high"?"err":f.severity==="medium"?"warn":"")+'">'+f.severity+'</span> <span class="tag">'+esc(f.category)+'</span> <span class="tag">'+f.status+"</span>"+(f.textHash!==h?' <span class="tag warn">text changed since</span>':"")+"<p>"+esc(f.desc)+"</p>"+(f.evidence?'<p class="mute">Passage: “'+esc(f.evidence)+"”"+(f.evidenceFound?"":" (not found verbatim in the chapter)")+"</p>":"")+'<p class="mute">Suggested: '+esc(f.action)+(f.confidence!=null?" · confidence "+f.confidence:"")+'</p><div class="row">'+Object.keys(FIND_FLOW[f.status]||{}).map(a=>'<button class="btn alt" data-a="finding" data-act="'+a+'" data-id="'+f.id+'">'+a[0].toUpperCase()+a.slice(1)+"</button>").join("")+(f.replacement&&f.evidenceFound&&c.status!=="approved"?'<button class="btn" data-a="fixF" data-id="'+f.id+'">Apply fix</button>':"")+"</div></div>").join(""):'<p class="mute">No open findings.</p>')+"</div>"}

const A={

  addBook(){const t=val("bt").trim();if(!t)return msg="Title is required.";const sid=val("bs");const b={id:id("bk"),seriesId:sid,title:t,order:S.books.filter(x=>x.seriesId===sid).length+1,target:parseInt(val("bw"))||0,status:"drafting",created:now()};S.books.push(b);log("book.create",t,b.id);bookId=b.id;msg=""},
  open(e){bookId=e.dataset.id;msg=""},back(){bookId=null;msg=""},
  addCh(e){if(!approvedBrief(e.dataset.id))return msg="Approve a story brief for this book in Story Studio before adding chapters.";const n=chaptersOf(e.dataset.id).length+1;const c={id:id("ch"),bookId:e.dataset.id,number:n,title:"Chapter "+n,text:"",status:"draft",version:1,created:now(),updated:now()};S.chapters.push(c);log("chapter.create",c.title,c.id);msg=""},
  delCh(e){const c=S.chapters.find(x=>x.id===e.dataset.id);if(c.status!=="draft")return;S.chapters=S.chapters.filter(x=>x!==c);S.chapters.filter(x=>x.bookId===c.bookId).sort((a,b)=>a.number-b.number).forEach((x,i)=>x.number=i+1);log("chapter.delete",c.title)},
  saveCh(e){const c=S.chapters.find(x=>x.id===e.dataset.id);syncCh(c);return true},
  ch(e){const c=S.chapters.find(x=>x.id===e.dataset.id);if(c.status!=="approved")syncCh(c);msg=chTransition(c,e.dataset.act)},
  bk(e){const b=S.books.find(x=>x.id===e.dataset.id);msg=bkTransition(b,e.dataset.act)},
  exp(e){const b=S.books.find(x=>x.id===e.dataset.id);const d=$("#exp");d.innerHTML='<textarea readonly style="margin-top:8px"></textarea>';d.firstChild.value=manuscript(b);d.firstChild.select();log("export",b.title+" ("+(b.status==="approved"?"approved":"unapproved draft")+")",b.id);save();return"keep"},
  bkp(){$("#bx").value=JSON.stringify(S);return"keep"},
  rst(){try{const v=JSON.parse(val("bx"));if(!v||!Array.isArray(v.pens)||!Array.isArray(v.books)||!Array.isArray(v.chapters)||!Array.isArray(v.series))throw 0;S=migrate(v);log("restore","Restored from backup");msg=""}catch(x){msg="That is not a valid INKFORGE backup. Nothing was changed.";alert(msg)}},
  genOutline(e){msg="";const b=S.books.find(x=>x.id===e.dataset.id),br=approvedBrief(b.id);if(!br)return msg="Approve a story brief first.";
    const n=Math.min(60,Math.max(1,parseInt(val("on"))||20));
    const p="Plan a "+n+"-chapter outline for the book “"+b.title+"”. Each array item must have string keys: title, pov, purpose, start, events, decisions, beats, progression, conflict, end, refs, target (target is a word count as a string). Do not contradict the approved canon.\n\nAPPROVED STORY BRIEF:\n"+briefText(br)+"\n\nAPPROVED CANON:\n"+canonText(b.seriesId);
    const t=mkTask("outline",b.id,p);if(t){runTask(t);return"keep"}},
  genDraft(e){msg="";const c=S.chapters.find(x=>x.id===e.dataset.id);if(c.status==="approved")return;syncCh(c);const b=S.books.find(x=>x.id===c.bookId),br=approvedBrief(b.id);
    if(!br)return msg="Approve a story brief first.";if(!(c.outline||"").trim())return msg="Add or generate an outline for this chapter first.";
    const prev=chaptersOf(b.id).filter(x=>x.number<c.number&&wc(x.text)).pop(),tail=prev?"PREVIOUS CHAPTER ENDING (chapter "+prev.number+"):\n"+prev.text.slice(-1500):"(this is the first chapter)";
    const tw=parseInt((c.outline.match(/Target words: *(\d+)/)||[])[1])||2500;
    const p="Write chapter "+c.number+", “"+c.title+"”, as polished prose of roughly "+tw+" words. Honour the brief’s point of view, tense, tone, heat level and content boundaries. Do not contradict approved canon.\n\nSTORY BRIEF:\n"+briefText(br)+"\n\nAPPROVED CANON:\n"+canonText(b.seriesId)+"\n\nCHAPTER OUTLINE:\n"+c.outline+"\n\n"+tail;
    const t=mkTask("draft",c.id,p);if(t){runTask(t);return"keep"}},
  useDraft(e){const t=S.tasks.find(x=>x.id===e.dataset.id),c=S.chapters.find(x=>x.id===t.ref);if(c.status==="approved")return msg="Chapter is approved and locked. Reopen it first.";S.versions.push({id:id("ver"),chapterId:c.id,version:c.version,title:c.title,text:c.text,at:now()});c.version++;c.text=t.result;c.updated=now();t.closed=true;log("chapter.ai_draft_applied",c.title+" → v"+c.version+" from "+t.id,c.id)},
  discardDraft(e){const t=S.tasks.find(x=>x.id===e.dataset.id);t.closed=true;log("task.discard","draft",t.id)},
  closeT(e){const t=S.tasks.find(x=>x.id===e.dataset.id);t.closed=true;log("task.discard",t.kind,t.id)},
  applyOutline(e){const t=S.tasks.find(x=>x.id===e.dataset.id),b=S.books.find(x=>x.id===t.ref);if(!approvedBrief(b.id))return msg="Approve a story brief first.";let n=chaptersOf(b.id).length;
    t.result.forEach(o=>{n++;const q={};Object.keys(o).forEach(k=>q[k]=String(o[k]));S.chapters.push({id:id("ch"),bookId:b.id,number:n,title:String(o.title),outline:fmtOutline(q),text:"",status:"draft",version:1,created:now(),updated:now()})});
    t.closed=true;log("outline.apply",t.result.length+" chapters added to "+b.title,t.id);bookId=b.id;view="books";msg=""},
  runT(e){const t=S.tasks.find(x=>x.id===e.dataset.id);if(t.status==="running")return;msg="";runTask(t);return"keep"},
  cancelT(e){const t=S.tasks.find(x=>x.id===e.dataset.id);const was=t.status;t.status="cancelled";t.error="Cancelled.";if(was==="running"&&ctl[t.id])ctl[t.id].abort();log("task.cancelled",t.kind,t.id)},
  saveAI(){const k=val("apikey").trim(),s=S.settings;if(k){try{localStorage.setItem(KEYNAME,k)}catch(x){msg="Could not store the key in this browser."}}s.model=val("amodel").trim()||s.model;s.limit=Math.max(0,parseInt(val("alimit"))||0);s.maxOut=Math.min(32000,Math.max(256,parseInt(val("amax"))||6000));s.retries=Math.min(5,Math.max(0,parseInt(val("aret"))||0));log("settings","AI settings saved")},
  clearKey(){try{localStorage.removeItem(KEYNAME)}catch(x){}log("settings","API key removed")},
  genEdit(e){msg="";const c=S.chapters.find(x=>x.id===e.dataset.id);if(c.status==="approved")return;syncCh(c);if(!wc(c.text))return msg="Chapter is empty.";const br=approvedBrief(c.bookId);if(!br)return msg="Approve a story brief first.";
    const sc=val("es_"+c.id)||"line",f=br.fields,sid=(S.books.find(b=>b.id===c.bookId)||{}).seriesId;
    const p="Review ONLY this chapter for: "+SCOPES[sc]+". Return a JSON array of at most 10 findings (empty array if none). Each finding: severity (high|medium|low), category, description, evidence (exact passage copied verbatim from the chapter, under 200 characters), replacement (minimal replacement for exactly that passage, or empty string), action (recommended action), confidence (number 0 to 1). Prefer minimal targeted fixes. Do not rewrite the chapter.\n\nBRIEF CONSTRAINTS:\nTone: "+f.tone+"\nPOV: "+f.pov+"\nTense: "+f.tense+"\nBoundaries: "+f.boundaries+"\nContinuity: "+f.continuity+"\n\nAPPROVED CANON:\n"+canonText(sid)+"\n\nCHAPTER "+c.number+" TEXT:\n"+c.text;
    const t=mkTask("editorial",c.id,p);if(t){t.scope=sc;runTask(t);return"keep"}},
  finding(e){msg=fTransition(S.findings.find(x=>x.id===e.dataset.id),e.dataset.act)},
  fixF(e){const f=S.findings.find(x=>x.id===e.dataset.id),c=S.chapters.find(x=>x.id===f.chapterId);
    if(c.status==="approved")return msg="Chapter is approved and locked. Reopen it first.";if(!f.replacement||!f.evidence)return msg="No replacement suggested.";
    const n=c.text.split(f.evidence).length-1;if(n!==1)return msg=n?"Passage appears "+n+" times; edit by hand.":"Passage no longer found; edit by hand.";
    S.versions.push({id:id("ver"),chapterId:c.id,version:c.version,title:c.title,text:c.text,at:now()});c.version++;c.text=c.text.replace(f.evidence,()=>f.replacement);c.updated=now();f.status="resolved";log("finding.fix",f.category+" fixed in "+c.title+" → v"+c.version,f.id);msg=""},
  newBrief(){const f={};BRIEF.forEach(x=>f[x[0]]="");S.briefs.push({id:id("brf"),bookId:selBook,version:1,status:"draft",fields:f,at:now()});log("brief.create","v1",selBook);msg=""},
  saveBrief(){const br=briefsOf(selBook)[0];if(br.status!=="draft")return;readBrief(br);br.at=now();log("brief.save","v"+br.version,br.id);msg=""},
  approveBrief(){const br=briefsOf(selBook)[0];if(br.status!=="draft")return;readBrief(br);const miss=BRIEF.filter(f=>f[3]&&!(br.fields[f[0]]||"").trim()).map(f=>f[1]);if(miss.length){msg="Missing required fields: "+miss.join(", ");return}briefsOf(selBook).forEach(x=>{if(x.status==="approved")x.status="superseded"});br.status="approved";br.approvedAt=now();S.approvals.push({id:id("apr"),kind:"brief",ref:br.id,at:now(),version:br.version});log("brief.approve","v"+br.version,br.id);msg=""},
  reviseBrief(){const br=briefsOf(selBook)[0];if(br.status!=="approved")return;S.briefs.push({id:id("brf"),bookId:selBook,version:br.version+1,status:"draft",fields:Object.assign({},br.fields),at:now()});log("brief.revise","v"+(br.version+1)+" started from approved v"+br.version,br.id);msg=""},
  addCanon(){const n=val("cn").trim(),d=val("cd").trim();if(!n||!d)return msg="Name and description are required.";const c={id:id("fact"),seriesId:selSeries,type:val("ct"),name:n,desc:d,source:val("cs"),supersedes:val("cr")||null,status:"proposed",version:1,at:now()};S.canon.push(c);log("canon.propose",c.type+": "+n,c.id);msg=""},
  canon(e){msg=canonTransition(S.canon.find(x=>x.id===e.dataset.id),e.dataset.act)},
  delCanon(e){const c=S.canon.find(x=>x.id===e.dataset.id);if(c.status!=="proposed")return msg="Only proposed entries can be deleted.";S.canon=S.canon.filter(x=>x!==c);log("canon.delete",c.name)},
  th(e){document.documentElement.dataset.theme=e.dataset.v;return"keep"}
};
function syncCh(c){const t=document.querySelector('[data-f="text"][data-id="'+c.id+'"]'),ti=document.querySelector('[data-f="title"][data-id="'+c.id+'"]');if(!t)return;
  const ol=document.querySelector('[data-f="outline"][data-id="'+c.id+'"]');if(ol&&ol.value!==(c.outline||"")){c.outline=ol.value;c.updated=now();log("chapter.outline",c.title,c.id)}
  if(t.value!==c.text||ti.value!==c.title){S.versions.push({id:id("ver"),chapterId:c.id,version:c.version,title:c.title,text:c.text,at:now()});c.version++;c.text=t.value;c.title=ti.value||c.title;c.updated=now();log("chapter.save",c.title+" → v"+c.version,c.id)}}

document.addEventListener("click",ev=>{
  const v=ev.target.closest("nav button[data-v]");if(v){view=v.dataset.v;bookId=null;msg="";render();return}
  const b=ev.target.closest("[data-a]");if(!b)return;
  const r=A[b.dataset.a](b);if(r==="keep")return;commit()});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="kill"){S.settings.kill=t.checked;log("settings","AI kill switch "+(t.checked?"on":"off"));commit()}
  if(t.id==="noai"){S.settings.noAI=t.checked;log("settings","No-AI mode "+(t.checked?"on":"off"));commit()}
  if(t.id==="sb"){selBook=t.value;msg="";render()}if(t.id==="sbs"){selSeries=t.value;msg="";render()}if(t.id==="tol"){S.settings.tol=Math.max(0,parseInt(t.value)||15);commit()}});

render();load().then(render);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
